<dialog
  #dialog
  (click)="onBackdropClick($event)"
  (cancel)="onCancel($event)"
  class="p-0 m-auto bg-transparent border-0 outline-none max-w-none max-h-none"
>
  <div
    class="w-105 max-w-[calc(100vw-40px)] rounded-[18px] bg-card/95 border border-white/12 px-7 pt-7 pb-6 shadow-[0_24px_60px_rgba(0,0,0,0.7)]"
  >
    <h2 class="text-[18px] font-semibold text-white m-0 mb-2 tracking-[-0.01em]">
      {{ title() }}
    </h2>
    <p class="text-[13px] text-white/60 m-0 mb-6.5 leading-[1.55]">
      {{ message() }}
    </p>

    <ng-content></ng-content>

    <div class="flex justify-end gap-2.5">
      <button
        (click)="cancelled.emit()"
        [disabled]="loading()"
        class="px-4.5 py-2.5 rounded-[10px] cursor-pointer bg-white/6 border border-white/12 text-white/80 font-sans text-[13px] font-medium"
      >
        Annuler
      </button>
      <button
        (click)="confirmed.emit()"
        [disabled]="loading()"
        class="px-4.5 py-2.5 rounded-[10px] cursor-pointer bg-state-danger border-0 text-accent-dark font-sans text-[13px] font-semibold shadow-danger-btn transition-opacity"
        [style.opacity]="loading() ? '0.6' : '1'"
      >
        @if (loading()) {
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="animate-spin"
          >
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
        } @else {
          {{ confirmLabel() }}
        }
      </button>
    </div>
  </div>
</dialog>
