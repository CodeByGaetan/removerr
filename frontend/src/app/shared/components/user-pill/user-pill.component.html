<div class="inline-flex items-center gap-1.75 py-1.25 pr-3 pl-1.25 rounded-full"
     [style.background]="watched() ? 'rgba(12,10,20,0.85)' : 'rgba(255,255,255,0.03)'"
     [style.border]="watched() ? '1px solid rgba(255,255,255,0.12)' : '1px dashed rgba(255,255,255,0.12)'"
     [style.opacity]="watched() ? '1' : '0.55'">

  <user-avatar [name]="user().name" [size]="22"/>

  <div class="flex flex-col leading-[1.15]">
    <span class="text-[12px] font-medium"
          [style.color]="watched() ? '#fff' : 'rgba(255,255,255,0.7)'">
      {{ user().name }}
    </span>
    <span class="text-[9px] font-mono tracking-[0.3px] uppercase"
          [style.color]="watched() ? userHue() : 'rgba(255,255,255,0.4)'">
      {{ watched() ? 'vu' : 'pas vu' }}
    </span>
  </div>
</div>
