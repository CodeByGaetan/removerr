<div class="px-6 py-5.5 rounded-[14px] bg-white/3 border border-white/8">
  <div class="text-[15px] font-semibold text-white mb-1">Tâches planifiées</div>
  <div class="text-[12px] text-white/55 mb-4.5">
    Exécutées automatiquement par le serveur, ou à la demande
  </div>

  <div class="flex flex-col gap-0.5">
    @for (job of jobs(); track job.key) {
      <div
        class="flex flex-col gap-3 px-3 py-3 rounded-[10px] bg-white/2 md:flex-row md:items-center md:gap-6"
      >
        <!-- Name + schedule -->
        <div class="flex-1 min-w-0">
          <div class="text-[14px] font-medium text-white">{{ name(job) }}</div>
          <div class="mt-0.5 text-[11px] font-mono text-white/40">{{ schedule(job) }}</div>
        </div>

        <!-- Runs -->
        <div class="grid grid-cols-2 gap-4 text-[12px] md:w-[360px]">
          <div>
            <div class="text-[10px] font-mono tracking-[1px] uppercase text-white/40 mb-1">
              Dernière
            </div>
            @if (job.lastRunAt) {
              <div class="flex items-center gap-1.5 text-white/75">
                <span
                  class="w-1.5 h-1.5 rounded-full shrink-0"
                  [class]="job.lastRunSucceeded ? 'bg-state-ok' : 'bg-state-danger'"
                  [attr.aria-label]="job.lastRunSucceeded ? 'Succès' : 'Échec'"
                ></span>
                {{ dayAndTime(job.lastRunAt) }}
              </div>
            } @else {
              <div class="text-white/35">—</div>
            }
          </div>
          <div>
            <div class="text-[10px] font-mono tracking-[1px] uppercase text-white/40 mb-1">
              Prochaine
            </div>
            <div class="text-white/75">
              {{ job.nextRunAt ? dayAndTime(job.nextRunAt) : '—' }}
            </div>
          </div>
        </div>

        <!-- Run now -->
        <button
          type="button"
          (click)="run(job)"
          [disabled]="job.running"
          class="glass inline-flex items-center justify-center gap-2 px-4 py-2.25 rounded-[10px] cursor-pointer text-white font-sans text-[13px] font-medium transition-opacity disabled:cursor-default disabled:opacity-60 md:w-[120px]"
        >
          @if (job.running) {
            En cours…
          } @else {
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 4l14 8-14 8z" />
            </svg>
            Lancer
          }
        </button>
      </div>
    }
  </div>
</div>
