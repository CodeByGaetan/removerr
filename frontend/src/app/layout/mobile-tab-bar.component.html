<nav class="glass-strong fixed bottom-0 left-0 right-0 z-50 pt-2.5 px-4 pb-[max(10px,env(safe-area-inset-bottom,0))]">
  <div class="flex justify-around items-center">

    <!-- Library -->
    <a routerLink="/library" routerLinkActive #rlaLib="routerLinkActive"
       class="flex flex-col items-center gap-0.75 px-3 py-1.5 rounded-xl no-underline min-w-15 transition-colors"
       [style.color]="rlaLib.isActive ? '#fff' : 'rgba(255,255,255,0.55)'"
       [style.background]="rlaLib.isActive ? 'rgba(255,255,255,0.12)' : 'transparent'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="9" height="9" rx="1"/>
        <rect x="13" y="2" width="9" height="9" rx="1"/>
        <rect x="2" y="13" width="9" height="9" rx="1"/>
        <rect x="13" y="13" width="9" height="9" rx="1"/>
      </svg>
      <span class="text-[9px] font-mono tracking-[0.3px] font-medium">Bibliothèque</span>
    </a>

    <!-- Trash -->
    <a routerLink="/trash" routerLinkActive #rlaTrash="routerLinkActive"
       class="flex flex-col items-center gap-0.75 px-3 py-1.5 rounded-xl no-underline min-w-15 transition-colors"
       [style.color]="rlaTrash.isActive ? '#fff' : 'rgba(255,255,255,0.55)'"
       [style.background]="rlaTrash.isActive ? 'rgba(255,255,255,0.12)' : 'transparent'">
      <div class="relative">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        </svg>
        @if (trashCount() > 0) {
          <div class="absolute -top-1.25 -right-2 min-w-3.75 h-3.75 rounded-lg bg-accent text-accent-dark text-[8px] font-bold font-mono flex items-center justify-center px-0.75 leading-none">
            {{ trashCount() }}
          </div>
        }
      </div>
      <span class="text-[9px] font-mono tracking-[0.3px] font-medium">Corbeille</span>
    </a>

    <!-- Audit -->
    <a routerLink="/audit" routerLinkActive #rlaAudit="routerLinkActive"
       class="flex flex-col items-center gap-0.75 px-3 py-1.5 rounded-xl no-underline min-w-15 transition-colors"
       [style.color]="rlaAudit.isActive ? '#fff' : 'rgba(255,255,255,0.55)'"
       [style.background]="rlaAudit.isActive ? 'rgba(255,255,255,0.12)' : 'transparent'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span class="text-[9px] font-mono tracking-[0.3px] font-medium">Audit</span>
    </a>

    <!-- Settings -->
    <a routerLink="/settings" routerLinkActive #rlaSet="routerLinkActive"
       class="flex flex-col items-center gap-0.75 px-3 py-1.5 rounded-xl no-underline min-w-15 transition-colors"
       [style.color]="rlaSet.isActive ? '#fff' : 'rgba(255,255,255,0.55)'"
       [style.background]="rlaSet.isActive ? 'rgba(255,255,255,0.12)' : 'transparent'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
        <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
        <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/>
        <line x1="17" y1="16" x2="23" y2="16"/>
      </svg>
      <span class="text-[9px] font-mono tracking-[0.3px] font-medium">Paramètres</span>
    </a>

  </div>
</nav>
